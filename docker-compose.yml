services:
  architech:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/xivizley/xivizley-architech:latest
    container_name: xivizley-architech
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
